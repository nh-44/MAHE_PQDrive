ecus:
  maps_ecu:
    domain: infotainment
    auto_deploy: true
  audio_ecu:
    domain: infotainment
    auto_deploy: true
  bluetooth_ecu:
    domain: infotainment
    auto_deploy: true
  braking_ecu:
    domain: safety_critical
    auto_deploy: false
    requires_dual_auth: true
  steering_ecu:
    domain: safety_critical
    auto_deploy: false
    requires_dual_auth: true
  adas_ecu:
    domain: safety_critical
    auto_deploy: false
    requires_dual_auth: true
  powertrain_ecu:
    domain: safety_critical
    auto_deploy: false
    requires_dual_auth: true

charging_policy:
  require_authenticated_charger: true
  allow_infotainment_updates_while_charging: true
  allow_safety_critical_updates_while_charging: true
  max_request_age_seconds: 600
